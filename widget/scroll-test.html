<!DOCTYPE html>
<!--
  scroll-test.html — a page with real vertical distance between headings, for
  checking that the widget's scroll + highlight behaviour actually lands on the
  right element. Was: mini.html at the repo root.

  Serve it the same way as demo.html:
      cd widget && python -m http.server 5500
      http://localhost:5500/scroll-test.html
-->
<html lang="en">
<head><meta charset="utf-8"><title>Compass scroll test</title></head>
<body>
  <h1>Top of page</h1>
  <div style="height:1200px;background:#f0f0f0">scroll space</div>
  <h2 id="target">canonforces</h2>
  <div style="height:1200px;background:#e0e0e0">more space</div>

  <script src="compass-widget.js"
        data-api="http://localhost:8000"
        data-site="openlake-facts"></script>
</body>
</html>
